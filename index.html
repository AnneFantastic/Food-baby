<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pantry Recipes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7f1;--card:#fff;--ink:#1d2a1f;--mute:#5d6b5f;--line:#d9e0d3;--leaf:#2d6a3e;--leaf2:#e3efe2;--miss:#b23a28;--swap:#7a5b00;--swapbg:#fbf1cf}
@media(prefers-color-scheme:dark){:root{--bg:#141a15;--card:#1c241d;--ink:#e8efe6;--mute:#9fb0a1;--line:#2d392f;--leaf:#7fcf94;--leaf2:#22362a;--miss:#ff9582;--swap:#f0d27a;--swapbg:#3a3216}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
h1{font:400 clamp(28px,5vw,40px)/1.1 'Young Serif',Georgia,serif;margin:8px 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
label{font-weight:600;font-size:14px;display:block;margin-bottom:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.row>div{flex:1;min-width:150px}
input,select,button{font:inherit;color:inherit}
input[type=text],select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:var(--bg);font-weight:600}
.pitem{background:var(--leaf2);border:0;color:var(--ink)}.pitem::after{content:" ×";color:var(--mute)}
.link{background:none;border:0;color:var(--leaf);text-decoration:underline;cursor:pointer;padding:0;font-size:14px}
.count{color:var(--mute);margin:4px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--leaf2)}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font:400 18px/1.25 'Young Serif',Georgia,serif;margin:0}.cb h3 a{color:inherit;text-decoration:none}.cb h3 a:hover{text-decoration:underline}
.by{font-size:13px;color:var(--mute)}.meta{font-size:14px}
.have{color:var(--leaf);font-weight:600}.miss{color:var(--miss)}
.swap{background:var(--swapbg);color:var(--swap);border-radius:6px;padding:3px 8px;font-size:13px}
.tags{font-size:12px;color:var(--mute);margin-top:auto}
.empty{padding:30px;text-align:center;color:var(--mute)}
</style></head><body><div class="wrap">
<h1>Pantry Recipes</h1>
<p class="sub">Add what you have. See what you can make, what you're missing, and which swaps cover the gap.</p>
<div class="panel">
 <label for="add">What's in your kitchen?</label>
 <input type="text" id="add" placeholder="Type an ingredient and press Enter (e.g. lentils, carrots, tofu)" autocomplete="off">
 <div class="chips" id="pantry" aria-live="polite"></div>
 <p class="by" style="margin:10px 0 0">Always assumed: <span id="staples"></span> <button class="link" id="editStaples">edit</button></p>
</div>
<div class="panel"><div class="row">
 <div><label for="miss">Missing at most</label><select id="miss"><option value="99">Any number</option><option value="0">0 (I can make it now)</option><option value="1">1 ingredient</option><option value="2" selected>2 ingredients</option><option value="3">3 ingredients</option><option value="5">5 ingredients</option></select></div>
 <div><label for="sort">Sort by</label><select id="sort"><option value="best">Best match</option><option value="few">Fewest ingredients</option><option value="time">Quickest</option><option value="az">A–Z</option></select></div>
 <div><label for="src">Blog</label><select id="src"><option value="">All blogs</option></select></div>
 <div><label for="q">Search titles</label><input type="text" id="q" placeholder="e.g. burger"></div>
</div>
<label style="margin-top:14px">Type of recipe</label><div class="chips" id="tags"></div></div>
<div class="count" id="count"></div><div class="grid" id="grid"></div>
<p style="text-align:center"><button class="link" id="more" hidden>Show more</button></p>
<p class="by" style="text-align:center;margin-top:30px">Recipes belong to their authors. Every card links to the original blog for the full method.</p>
</div>
<script>
const $=s=>document.querySelector(s);
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const stem=w=>w.replace(/ies$/,'y').replace(/(o|ch|sh|x)es$/,'$1').replace(/s$/,'');
const words=t=>t.toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(Boolean).map(stem);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let R=[],pantry=load('pantry',[]),staples=load('staples',['salt','black pepper','water','oil']),tagsOn=new Set(),shown=48;
const has=(nw,items)=>items.some(i=>i.every(w=>nw.includes(w)));
function analyse(r){
  const P=pantry.map(words),S=staples.map(words),swaps=[],missing=[];let have=0,total=0;
  for(const ing of r.ing){
    if(ing.opt)continue;const nws=ing.names.map(words);
    if(nws.some(n=>has(n,S)))continue;
    total++;
    if(nws.some(n=>has(n,P))){have++;continue}
    let sw=null;
    for(const s of r.subs||[]){const f=words(s.for);
      if(nws.some(n=>f.every(w=>n.includes(w)))){const u=s.use.find(a=>has(words(a),P));if(u){sw=u;break}}}
    if(sw){have++;swaps.push(`${ing.names[0]} → ${sw}`)}else missing.push(ing.names[0]);
  }
  return{r,have,total,swaps,missing};
}
function render(){
  const q=$('#q').value.toLowerCase(),src=$('#src').value,maxMiss=+$('#miss').value;
  let L=R.map(analyse).filter(a=>(!src||a.r.source===src)&&(!q||a.r.title.toLowerCase().includes(q))&&[...tagsOn].every(t=>a.r.tags.includes(t)));
  if(pantry.length)L=L.filter(a=>a.missing.length<=maxMiss);
  const so=$('#sort').value,m=a=>a.r.minutes??999;
  L.sort((a,b)=>so==='az'?a.r.title.localeCompare(b.r.title):so==='time'?m(a)-m(b):so==='few'?a.total-b.total:(pantry.length?a.missing.length-b.missing.length:0)||a.total-b.total);
  $('#count').textContent=`${L.length} recipe${L.length==1?'':'s'}`+(pantry.length?'':' · add ingredients above to match your kitchen');
  $('#grid').innerHTML=L.slice(0,shown).map(({r,have,total,swaps,missing})=>`<article class="card">${r.image?`<img src="${esc(r.image)}" alt="" loading="lazy">`:''}<div class="cb">
   <h3><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a></h3>
   <div class="by">by ${esc(r.author)} · ${esc(r.source)}</div>
   <div class="meta">${pantry.length?`<span class="have">You have ${have} of ${total}</span>`:`${total} ingredients`}${r.minutes?` · ${r.minutes} min`:''}</div>
   ${missing.length?`<div class="meta miss">Missing: ${missing.map(esc).join(', ')}</div>`:''}
   ${swaps.map(s=>`<div class="swap">Swap: ${esc(s)}</div>`).join('')}
   <div class="tags">${r.tags.map(esc).join(' · ')}</div></div></article>`).join('')||'<div class="empty">No matches. Try allowing more missing ingredients or removing a filter.</div>';
  $('#more').hidden=L.length<=shown;
}
function chips(){
  $('#pantry').innerHTML=pantry.map((p,i)=>`<button class="chip pitem" data-i="${i}" aria-label="Remove ${esc(p)}">${esc(p)}</button>`).join('');
  $('#staples').textContent=staples.join(', ');
}
$('#add').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){e.target.value.split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>{if(!pantry.includes(s))pantry.push(s)});e.target.value='';save('pantry',pantry);chips();render()}});
$('#pantry').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b){pantry.splice(+b.dataset.i,1);save('pantry',pantry);chips();render()}});
$('#editStaples').onclick=()=>{const v=prompt('Things you always have (comma separated):',staples.join(', '));if(v!==null){staples=v.split(',').map(s=>s.trim()).filter(Boolean);save('staples',staples);chips();render()}};
['miss','sort','src','q'].forEach(id=>$('#'+id).addEventListener('input',()=>{shown=48;render()}));
$('#more').onclick=()=>{shown+=48;render()};
$('#tags').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;const t=b.dataset.t;tagsOn.has(t)?tagsOn.delete(t):tagsOn.add(t);b.classList.toggle('on');shown=48;render()});
fetch('data/recipes.json').then(r=>r.json()).then(d=>{R=d;
  const cnt={};d.forEach(r=>r.tags.forEach(t=>cnt[t]=(cnt[t]||0)+1));
  $('#tags').innerHTML=Object.keys(cnt).sort().map(t=>`<button class="chip" data-t="${esc(t)}">${esc(t)} (${cnt[t]})</button>`).join('');
  [...new Set(d.map(r=>r.source))].forEach(s=>$('#src').insertAdjacentHTML('beforeend',`<option>${esc(s)}</option>`));
  chips();render()}).catch(()=>$('#grid').innerHTML='<div class="empty">Could not load data/recipes.json.</div>');
</script></body></html>
